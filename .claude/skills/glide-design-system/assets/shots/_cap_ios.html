<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>html,body{margin:0}#wrap{width:390px;transform-origin:top left}</style>
</head><body>
<div id="stage" style="width:430px;height:520px;overflow:hidden"><div id="wrap"><div id="root"></div></div></div>
<script type="text/babel" src="../../ui_kits/ios/TodayScreen.jsx"></script>
<script type="text/babel" src="../../ui_kits/ios/FocusScreen.jsx"></script>
<script type="text/babel" src="../../ui_kits/ios/DecksScreen.jsx"></script>
<script type="text/babel" src="../../ui_kits/ios/YouScreen.jsx"></script>
<script type="text/babel" src="../../ui_kits/ios/App.jsx"></script>
<script type="text/babel">
  function mount(){
    if(!window.IOSApp||!window.GlideDesignSystem_f9fc81){return setTimeout(mount,40);}
    ReactDOM.createRoot(document.getElementById('root')).render(<window.IOSApp/>);
    const s=Math.min(430/390, 520/844); // fit whole phone
    document.getElementById('wrap').style.transform='scale('+s+')';
    document.getElementById('stage').style.width=(390*s)+'px';
    document.getElementById('stage').style.height=(844*s)+'px';
    setTimeout(()=>window.lucide&&window.lucide.createIcons(),80);
  }
  mount();
</script>
</body></html>
