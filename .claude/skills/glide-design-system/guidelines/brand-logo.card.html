<!-- @dsCard group="Brand" viewport="700x160" name="Logo" subtitle="Paper-plane mark + Bricolage wordmark" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-body);padding:0;display:flex;height:100%}
  .cell{flex:1;display:flex;align-items:center;justify-content:center;gap:14px}
  .cell+.cell{border-left:1px solid var(--border-soft)}
  .dark{background:var(--ink-900)}
  .word{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-1.5px;color:var(--text-strong)}
  .word.on-dark{color:#fff}
</style>
<div class="cell"><img src="../assets/logo-mark.svg" width="56" height="56"><span class="word">Glide</span></div>
<div class="cell dark"><img src="../assets/logo-mark.svg" width="56" height="56"><span class="word on-dark">Glide</span></div>
<div class="cell"><img src="../assets/logo-mark.svg" width="80" height="80"></div>
