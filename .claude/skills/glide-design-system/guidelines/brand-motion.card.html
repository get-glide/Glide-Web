<!-- @dsCard group="Brand" viewport="700x150" name="Motion & easing" subtitle="Gentle glide — decelerate, no snap" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-body);padding:22px;display:flex;flex-direction:column;gap:16px;justify-content:center}
  .track{position:relative;height:34px;background:var(--surface-sunken);border-radius:var(--radius-full)}
  .dot{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--glide-500);box-shadow:var(--shadow-glide)}
  .g1{animation:g1 2.4s var(--ease-glide) infinite}
  .g2{animation:g1 2.4s cubic-bezier(.34,1.56,.64,1) infinite;background:var(--apricot-500);box-shadow:none}
  @keyframes g1{0%,12%{left:3px}50%,62%{left:calc(100% - 31px)}100%{left:3px}}
  .lbl{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-bottom:-8px}
</style>
<div class="lbl">--ease-glide · UI chrome (no overshoot)</div>
<div class="track"><div class="dot g1"></div></div>
<div class="lbl">soft spring · celebratory moments only</div>
<div class="track"><div class="dot g2"></div></div>
