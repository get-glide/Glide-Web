<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-body);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--surface-card);border:1px solid var(--border-soft);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-xs)}
  .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .yes .tag{color:var(--sage-600)}
  .no .tag{color:var(--coral-600)}
  .msg{margin-top:7px;font-size:14.5px;color:var(--text-strong);line-height:1.45}
  .no .msg{color:var(--text-muted);text-decoration:line-through;text-decoration-color:var(--coral-300)}
</style>
<div class="card yes"><div class="tag">Do — say</div><div class="msg">"Yesterday slipped by — no worries. Start a fresh one today."</div></div>
<div class="card no"><div class="tag">Don't — say</div><div class="msg">"You broke your 7-day streak! Don't lose your progress!!"</div></div>
<div class="card yes"><div class="tag">Do — say</div><div class="msg">"Let's glide. 25 minutes, phone down."</div></div>
<div class="card no"><div class="tag">Don't — say</div><div class="msg">"START YOUR PRODUCTIVITY SESSION NOW 🚀🔥"</div></div>
