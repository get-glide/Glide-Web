<!-- @dsCard group="Colors" viewport="700x150" name="Playful accents" subtitle="Sage, apricot & lilac — warmth without noise" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:14px}
  .col{flex:1}
  .pair{display:flex;gap:6px}
  .sw{flex:1;height:64px;border-radius:var(--radius-sm)}
  .lbl{font-size:11px;color:var(--text-muted);margin-top:8px;font-family:var(--font-mono)}
  .name{font-size:13px;font-weight:600;color:var(--text-strong);margin-bottom:8px}
</style>
<div class="row">
  <div class="col"><div class="name">Sage</div><div class="pair"><div class="sw" style="background:var(--sage-100)"></div><div class="sw" style="background:var(--sage-500)"></div><div class="sw" style="background:var(--sage-700)"></div></div><div class="lbl">#5fae92 · focus / success</div></div>
  <div class="col"><div class="name">Apricot</div><div class="pair"><div class="sw" style="background:var(--apricot-100)"></div><div class="sw" style="background:var(--apricot-500)"></div><div class="sw" style="background:var(--apricot-700)"></div></div><div class="lbl">#ee9a6b · streaks / warmth</div></div>
  <div class="col"><div class="name">Lilac</div><div class="pair"><div class="sw" style="background:var(--lilac-100)"></div><div class="sw" style="background:var(--lilac-500)"></div><div class="sw" style="background:var(--lilac-600)"></div></div><div class="lbl">#a888dd · tertiary</div></div>
</div>
