<!-- @dsCard group="Colors" viewport="700x170" name="Paper & ink neutrals" subtitle="Warm off-white surfaces, soft warm ink text" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-body);padding:20px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .sw{height:60px;border-radius:var(--radius-sm);border:1px solid var(--border-soft);display:flex;align-items:flex-end;padding:8px}
  .sw span{font-size:10px;font-family:var(--font-mono);font-weight:600}
  .lbl{font-size:11px;color:var(--text-muted);margin:6px 2px 2px;font-family:var(--font-mono)}
</style>
<div class="grid">
  <div><div class="sw" style="background:var(--paper-0)"><span>#ffffff</span></div><div class="lbl">paper-0</div></div>
  <div><div class="sw" style="background:var(--paper-50)"><span>#fbf9f4</span></div><div class="lbl">paper-50 · app</div></div>
  <div><div class="sw" style="background:var(--paper-100)"><span>#f5f1e9</span></div><div class="lbl">paper-100</div></div>
  <div><div class="sw" style="background:var(--paper-200)"><span>#ece6da</span></div><div class="lbl">paper-200</div></div>
  <div><div class="sw" style="background:var(--ink-400)"><span style="color:#fff">#9895a1</span></div><div class="lbl">ink-400 · faint</div></div>
  <div><div class="sw" style="background:var(--ink-500)"><span style="color:#fff">#6c6c78</span></div><div class="lbl">ink-500 · muted</div></div>
  <div><div class="sw" style="background:var(--ink-700)"><span style="color:#fff">#45454f</span></div><div class="lbl">ink-700 · body</div></div>
  <div><div class="sw" style="background:var(--ink-900)"><span style="color:#fff">#292933</span></div><div class="lbl">ink-900 · strong</div></div>
</div>
