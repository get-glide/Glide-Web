<!-- @dsCard group="Colors" viewport="700x150" name="Glide primary" subtitle="Periwinkle primary scale — calm, focused" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:10px}
  .sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;box-shadow:var(--shadow-xs)}
  .sw span{font-size:11px;font-weight:600;font-family:var(--font-mono)}
  .sw small{font-size:10px;opacity:.8;font-family:var(--font-mono)}
</style>
<div class="row">
  <div class="sw" style="background:var(--glide-100)"><span style="color:var(--glide-700)">100</span><small style="color:var(--glide-700)">#e6eafd</small></div>
  <div class="sw" style="background:var(--glide-300)"><span style="color:var(--glide-900)">300</span><small style="color:var(--glide-900)">#aab6f7</small></div>
  <div class="sw" style="background:var(--glide-500)"><span style="color:#fff">500 · primary</span><small style="color:#fff">#6c7bf0</small></div>
  <div class="sw" style="background:var(--glide-600)"><span style="color:#fff">600 · hover</span><small style="color:#fff">#5462df</small></div>
  <div class="sw" style="background:var(--glide-700)"><span style="color:#fff">700 · press</span><small style="color:#fff">#4450c2</small></div>
</div>
