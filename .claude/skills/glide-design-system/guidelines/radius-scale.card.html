<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft & generous — roundness is a brand signal" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-body);padding:22px;display:flex;align-items:center;gap:16px}
  .u{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:74px;height:74px;background:var(--glide-100);border:1.5px solid var(--glide-300)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
</style>
<div class="u"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lbl">xs · 6</div></div>
<div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm · 10</div></div>
<div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md · 14</div></div>
<div class="u"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg · 20</div></div>
<div class="u"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl · 28</div></div>
<div class="u"><div class="box" style="border-radius:var(--radius-full)"></div><div class="lbl">full</div></div>
