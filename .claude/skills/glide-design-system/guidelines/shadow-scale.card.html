<!-- @dsCard group="Spacing" viewport="700x160" name="Shadow system" subtitle="Soft, diffuse, warm-tinted — never harsh" -->
<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-app);font-family:var(--font-body);padding:26px 22px;display:flex;align-items:center;gap:22px}
  .u{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:78px;height:56px;background:var(--surface-card);border-radius:var(--radius-md)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-faint)}
</style>
<div class="u"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">sm · card</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">md</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">lg</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lbl">xl · modal</div></div>
<div class="u"><div class="box" style="box-shadow:var(--shadow-glide)"></div><div class="lbl">glide glow</div></div>
